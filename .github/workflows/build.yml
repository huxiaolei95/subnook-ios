name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Subnook.xcodeproj \
            -scheme Subnook \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet \
            build

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Subnook.app"
          if [ ! -d "$APP" ]; then
            echo "构建产物不存在，列出目录："
            ls -R build/Build/Products || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Subnook-unsigned.ipa Payload
          ls -lh Subnook-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Subnook-unsigned-ipa
          path: Subnook-unsigned.ipa
          retention-days: 30
