name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # macos-13 已于 2025-09 关闭；macos-14 会解析成 arm64（本账号无权限）
    # macos-15-intel = Intel x64，公开仓库免费可用
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          echo "Runner: $RUNNER_OS / $(uname -m)"
          xcodebuild -version
          sw_vers

      - name: Install xcodegen
        run: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Subnook.xcodeproj \
            -scheme Subnook \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Subnook.app"
          if [ ! -d "$APP" ]; then
            echo "构建产物不存在，列出目录："
            ls -R build/Build/Products || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Subnook-unsigned.ipa Payload
          ls -lh Subnook-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Subnook-unsigned-ipa
          path: Subnook-unsigned.ipa
          retention-days: 30
